spring.application.name=code-executor

# Activate local overrides if present (gitignored): application-local.properties
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# =========================
# AWS S3 — set via env vars or application-local.properties
# =========================
aws.accessKey=${AWS_ACCESS_KEY:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:eu-north-1}
aws.bucketName=${AWS_BUCKET_NAME:}

# =========================
# MySQL — set via env vars or application-local.properties
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/code_executor}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
